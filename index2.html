<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담 신청하기 - Gemstone Fitness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #1a1a1a;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            padding: 50px 40px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .gift-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            position: relative;
        }

        .box-body {
            width: 60px;
            height: 50px;
            background: #FF8C00;
            position: absolute;
            bottom: 0;
            left: 10px;
            border-radius: 4px;
        }

        .box-body::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            height: 12px;
            background: #FFa500;
            border-radius: 4px 4px 0 0;
        }

        .box-lid {
            width: 66px;
            height: 15px;
            background: #FFa500;
            position: absolute;
            top: 22px;
            left: 7px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(255, 140, 0, 0.3);
        }

        .ribbon-v {
            width: 8px;
            height: 70px;
            background: #FF6B00;
            position: absolute;
            left: 36px;
            top: 5px;
        }

        .ribbon-h {
            width: 70px;
            height: 8px;
            background: #FF6B00;
            position: absolute;
            left: 5px;
            top: 33px;
        }

        .bow {
            width: 20px;
            height: 20px;
            background: #FF6B00;
            position: absolute;
            top: 0;
            left: 30px;
            border-radius: 50% 50% 0 0;
            transform: rotate(45deg);
        }

        .bow::before,
        .bow::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: #FF6B00;
            border-radius: 50%;
        }

        .bow::before {
            left: -8px;
            top: 4px;
        }

        .bow::after {
            right: -8px;
            top: 4px;
        }

        .headline {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .headline-line1 {
            color: #ffffff;
        }

        .headline-line2 {
            color: #666666;
        }

        .headline-line2 .highlight {
            color: #FF8C00;
        }

        .headline-line3 {
            color: #ffffff;
        }

        .subtitle {
            color: #999999;
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .required {
            color: #FF8C00;
            margin-left: 2px;
        }

        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid #333333;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #0a0a0a;
            color: #ffffff;
        }

        input[type="text"]::placeholder,
        input[type="tel"]::placeholder {
            color: #555555;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        select:focus {
            outline: none;
            border-color: #FF8C00;
            background: #000000;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF8C00' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            background-color: #0a0a0a;
            padding-right: 40px;
            color: #ffffff;
        }

        select option {
            background: #1a1a1a;
            color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: #FF8C00;
            color: #000000;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #FFa500;
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #333333;
            color: #666666;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #333333;
            border-top: 3px solid #FF8C00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #999999;
        }

        .success-message,
        .error-message {
            display: none;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
        }

        .success-message {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #FF8C00;
        }

        .error-message {
            background-color: #2a0000;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        .success-message.active,
        .error-message.active {
            display: block;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .success-message h3 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .benefit-text {
            font-size: 15px;
            line-height: 1.8;
            margin: 20px 0;
            color: #cccccc;
        }

        .benefit-text .highlight {
            color: #FF8C00;
            font-size: 18px;
            font-weight: 700;
        }

        .kakao-btn {
            display: inline-block;
            padding: 14px 30px;
            background-color: #FEE500;
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin: 20px 0 10px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .kakao-btn:hover {
            background-color: #FDD835;
            transform: translateY(-2px);
        }

        .kakao-btn:active {
            transform: translateY(0);
        }

        .sub-text {
            font-size: 13px;
            color: #999999;
            margin-top: 10px;
        }

        .reset-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #FF8C00;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background-color: #FF8C00;
            color: #000000;
            transform: translateY(-2px);
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        .privacy-notice {
            font-size: 12px;
            color: #666666;
            text-align: center;
            margin-top: 25px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            .headline {
                font-size: 28px;
            }

            .gift-box {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="gift-box">
                <div class="ribbon-v"></div>
                <div class="ribbon-h"></div>
                <div class="bow"></div>
                <div class="box-lid"></div>
                <div class="box-body"></div>
            </div>
            
            <div class="headline">
                <div class="headline-line1">상담 신청하고</div>
                <div class="headline-line2"><span class="highlight">6만원 상당의</span> 혜택을</div>
                <div class="headline-line3">지금 받아가세요</div>
            </div>
            <p class="subtitle">변화의 시작, 지금 바로 함께하세요</p>
        </div>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">이름 <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required 
                    placeholder="홍길동"
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="phone">전화번호 <span class="required">*</span></label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    required 
                    placeholder="010-1234-5678"
                    pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}"
                    autocomplete="tel"
                >
            </div>

            <div class="form-group">
                <label for="trainer">선호 트레이너</label>
                <select id="trainer" name="trainer">
                    <option value="">선택하지 않음</option>
                    <option value="이기영">이기영 트레이너</option>
                    <option value="최인기">최인기 트레이너</option>
                    <option value="차준영">차준영 트레이너</option>
                    <option value="이주희">이주희 트레이너</option>
                    <option value="안희우">안희우 트레이너</option>
                    <option value="황성국">황성국 트레이너</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                상담 신청하기
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>신청서를 전송하고 있습니다...</p>
        </div>

        <div class="success-message" id="successMessage">
            <div class="success-icon">🎉</div>
            <h3>신청이 완료되었습니다!</h3>
            <p class="benefit-text">
                <span class="highlight">6만원 상당의 혜택</span>을 준비해두었어요!<br>
                방문 시 성함을 말씀해주시면<br>
                특별 혜택을 바로 제공해드립니다.
            </p>
            <button class="kakao-btn" onclick="window.open('http://pf.kakao.com/_qpHxgn', '_blank')">
                💬 카카오톡 상담하기
            </button>
            <p class="sub-text">지금 바로 상담받으세요!</p>
            <button class="reset-btn" onclick="location.reload()">
                ↺ 처음으로 돌아가기
            </button>
        </div>

        <div class="error-message" id="errorMessage">
            ❌ 전송 중 오류가 발생했습니다.<br>
            다시 시도해주세요.
        </div>

        <div class="privacy-notice">
            🔒 방문 등록 전까지 개인정보는 사용되지 않습니다<br>
            미방문 시 30일 후 자동 삭제되며, 마케팅 용도로 절대 사용하지 않습니다.
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxjmklWOpJrb_hynKY65Q2xcOpTXWii1_u2SVvIOjtMCV0KDHGiUKSBLJzvYtmOXio/exec';

        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^0-9]/g, '');
            
            if (value.length <= 3) {
                e.target.value = value;
            } else if (value.length <= 7) {
                e.target.value = value.slice(0, 3) + '-' + value.slice(3);
            } else if (value.length <= 11) {
                e.target.value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7);
            } else {
                e.target.value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            form.style.display = 'none';
            loading.classList.add('active');
            submitBtn.disabled = true;

            const formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                trainer: document.getElementById('trainer').value || '선택 안함',
                timestamp: new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                setTimeout(() => {
                    loading.classList.remove('active');
                    successMessage.classList.add('active');
                    
                    // 자동 초기화 제거 - 사용자가 원할 때까지 성공 메시지 유지
                }, 1500);

            } catch (error) {
                console.error('Error:', error);
                loading.classList.remove('active');
                errorMessage.classList.add('active');
                form.style.display = 'block';
                submitBtn.disabled = false;

                setTimeout(() => {
                    errorMessage.classList.remove('active');
                }, 5000);
            }
        });
    </script>
</body>
</html>
