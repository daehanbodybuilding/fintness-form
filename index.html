<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담 신청하기 - Gemstone Fitness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #ff7a00 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .emoji {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .required {
            color: #e74c3c;
            margin-left: 2px;
        }

        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        select:focus {
            outline: none;
            border-color: #ff7a00;
            box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.15);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #000000 0%, #ff7a00 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 122, 0, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff7a00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message,
        .error-message {
            display: none;
            padding: 16px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
        }

        .success-message {
    background-color: #000000;
    color: #ffffff;
    border: 1px solid #ff7a00;
}

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .success-message.active,
        .error-message.active {
            display: block;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .privacy-notice {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 20px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 25px;
            }

            h1 {
                font-size: 24px;
            }

            .emoji {
                font-size: 40px;
            }
        }
        @media (max-width: 600px) {
            .container {
                padding: 30px 25px;
            }

            h1 {
                font-size: 24px;
            }

            .emoji {
                font-size: 40px;
            }
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .success-message h3 {
    color: #ffffff;
    font-size: 22px;
    margin-bottom: 15px;
    font-weight: 700;
}

        .benefit-text {
            font-size: 15px;
            line-height: 1.8;
            margin: 20px 0;
        }

        .benefit-text strong {
            color: #ff7a00;
            font-size: 17px;
        }

        .kakao-btn {
            display: inline-block;
            padding: 14px 30px;
            background-color: #FEE500;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 20px 0 10px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .kakao-btn:hover {
            background-color: #FDD835;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(254, 229, 0, 0.4);
        }

        .kakao-btn:active {
            transform: translateY(0);
        }

        .sub-text {
    font-size: 13px;
    color: #ffffff;
    margin-top: 10px;
    opacity: 0.8;
}
   .reset-btn {
    display: inline-block;
    padding: 12px 24px;
    background-color: transparent;
    color: #ffffff;
    border: 2px solid #ff7a00;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 15px;
    transition: all 0.3s ease;
}

.reset-btn:hover {
    background-color: #ff7a00;
    transform: translateY(-2px);
}

.reset-btn:active {
    transform: translateY(0);
}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="emoji">💪</div>
            <h1>상담 신청하기</h1>
            <p class="subtitle">변화의 시작, 지금 바로 함께하세요</p>
        </div>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">이름 <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required 
                    placeholder="홍길동"
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="phone">전화번호 <span class="required">*</span></label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    required 
                    placeholder="010-1234-5678"
                    pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}"
                    autocomplete="tel"
                >
            </div>

            <div class="form-group">
                <label for="trainer">선호 트레이너</label>
                <select id="trainer" name="trainer">
                    <option value="">선택하지 않음</option>
                    <option value="이기영">이기영 트레이너</option>
                    <option value="최인기">최인기 트레이너</option>
                    <option value="차준영">차준영 트레이너</option>
                    <option value="이주희">이주희 트레이너</option>
                    <option value="안희우">안희우 트레이너</option>
                    <option value="황성국">황성국 트레이너</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                🎁 6만원 무료 혜택 받기
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>신청서를 전송하고 있습니다...</p>
        </div>

        <div class="success-message" id="successMessage">
            <div class="success-icon">🎉</div>
            <h3>신청이 완료되었습니다!</h3>
            <p class="benefit-text">
                <strong>🎁 6만원 상당의 무료 PT 1회권</strong>을 준비해두었어요!<br>
                방문 시 성함을 말씀해주시면<br>
                특별 혜택을 바로 제공해드립니다.
            </p>
            <button class="kakao-btn" onclick="window.open('http://pf.kakao.com/_qpHxgn', '_blank')">
    💬 카카오톡 상담하기
</button>
<p class="sub-text">지금 바로 상담받으세요!</p>
<button class="reset-btn" onclick="location.reload()">
    ↺ 처음으로 돌아가기
</button>
        </div>

        <div class="error-message" id="errorMessage">
            ❌ 전송 중 오류가 발생했습니다.<br>
            다시 시도해주세요.
        </div>

        <div class="privacy-notice">
            🔒 방문 등록 전까지 개인정보는 사용되지 않습니다<br>
    미방문 시 30일 후 자동 삭제되며, 마케팅 용도로 절대 사용하지 않습니다.
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxjmklWOpJrb_hynKY65Q2xcOpTXWii1_u2SVvIOjtMCV0KDHGiUKSBLJzvYtmOXio/exec';

        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^0-9]/g, '');
            
            if (value.length <= 3) {
                e.target.value = value;
            } else if (value.length <= 7) {
                e.target.value = value.slice(0, 3) + '-' + value.slice(3);
            } else if (value.length <= 11) {
                e.target.value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7);
            } else {
                e.target.value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            form.style.display = 'none';
            loading.classList.add('active');
            submitBtn.disabled = true;

            const formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                trainer: document.getElementById('trainer').value || '선택 안함',
                timestamp: new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                setTimeout(() => {
                    loading.classList.remove('active');
                    successMessage.classList.add('active');
                    
              
                }, 1500);

            } catch (error) {
                console.error('Error:', error);
                loading.classList.remove('active');
                errorMessage.classList.add('active');
                form.style.display = 'block';
                submitBtn.disabled = false;

                setTimeout(() => {
                    errorMessage.classList.remove('active');
                }, 5000);
            }
        });
    </script>
</body>
</html>
